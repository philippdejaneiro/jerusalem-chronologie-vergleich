<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronologie-Vergleich: Zerstörung Jerusalems</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --accent: #4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
    .container { max-width: 880px; margin: 0 auto; padding: 20px 14px 48px; }
    header { margin-bottom: 18px; }
    .eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    h1 { margin: 4px 0 6px; font-size: 24px; line-height: 1.25; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    
    /* Navigation Tabs */
    .tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Controls & Badges */
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .filter-btn { background: var(--card); border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); }
    .filter-btn.active { background: #e0e7ff; color: #3730a3; border-color: #a5b4fc; }
    .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; transition: border-color 0.15s; }
    .card.clickable { cursor: pointer; }
    .card.selected { border: 2px solid var(--accent); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .card-title { font-size: 16px; font-weight: 700; margin: 0; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .badge-diff { background: #ffe4e6; color: #be123c; }
    .badge-same { background: #d1fae5; color: #047857; }
    .badge-cat { background: #f1f5f9; color: #334155; }

    /* Comparison Grids */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .grid-stack { grid-template-columns: 1fr; } }
    .box-jw { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; }
    .box-hist { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 10px 12px; }
    .box-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .box-jw .box-label { color: #92400e; }
    .box-hist .box-label { color: #075985; }
    .box-year { font-size: 19px; font-weight: 800; margin-top: 2px; }
    .box-claim { font-size: 14px; font-weight: 700; margin: 4px 0; }
    .box-desc { font-size: 13px; color: #334155; margin: 0; }

    /* Details & Source Pills */
    .details { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; color: #334155; }
    .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .source-link { font-size: 11px; font-weight: 600; background: #f1f5f9; color: #1e293b; text-decoration: none; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); display: inline-block; }
    .source-link:hover { background: #e0e7ff; color: #3730a3; }

    /* Markdown Reader */
    .doc-switcher { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .md-view { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; font-size: 14px; }
    .md-view h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .md-view h2 { font-size: 17px; margin-top: 22px; color: #1e293b; }
    .md-view h3 { font-size: 15px; margin-top: 16px; color: #334155; }
    .md-view blockquote { margin: 10px 0; padding: 10px 14px; background: #f8fafc; border-left: 3px solid var(--accent); color: #334155; font-style: italic; }
    .md-view table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; display: block; overflow-x: auto; }
    .md-view th, .md-view td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .md-view th { background: #f1f5f9; font-weight: 700; }
    .md-view code { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 12px; }
    .notice { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="eyebrow">Recherche-Projekt • Interaktiver Vergleich</div>
      <h1>Zerstörung Jerusalems: 607 vs. 587 v. u. Z.</h1>
      <p class="subtitle">Chronologie von Jehovas Zeugen (jw.org) und Geschichtswissenschaft im strukturierten Abgleich.</p>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="timeline">1. Zeitstrahl</button>

      <button class="tab-btn" data-tab="analyses">3. Analysen & Rohdaten</button>
      <button class="tab-btn" data-tab="sources">4. Quellen-Index</button>
    </nav>

    <div id="notice"></div>
    <main id="app">Lade Projektdaten...</main>
  </div>

  <script>
    const state = {
      tab: "timeline",
      events: [],
      sources: [],
      sourceMap: {},
      arguments: [],
      selectedEventId: "evt-03",
      filterDiffOnly: false,
      activeDoc: "analysen/03-direktvergleich.md",
      docCache: {}
    };

    const DOCS = [
      { path: "analysen/03-direktvergleich.md", label: "Direktvergleich" },
      { path: "analysen/01-sichtweise-jw.md", label: "01: Sichtweise jw.org" },
      { path: "analysen/02-sichtweise-hist.md", label: "02: Geschichtswissenschaft" },
      { path: "rohdaten/zitate-sammlung.md", label: "Rohdaten & Zitate" }
    ];

    const formatYear = (y) => `${Math.abs(y)} v. u. Z.`;

    // Robust CSV Parser for quoted fields
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const parseLine = (line) => {
        const res = [];
        let cur = "", inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { inQuotes = !inQuotes; }
          else if (ch === ',' && !inQuotes) { res.push(cur); cur = ""; }
          else { cur += ch; }
        }
        res.push(cur);
        return res;
      };
      const headers = parseLine(lines[0]);
      return lines.slice(1).map(line => {
        const vals = parseLine(line);
        const obj = {};
        headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || "").trim());
        return obj;
      });
    }

    // Lightweight Markdown to HTML converter
    function renderMarkdown(md) {
      let html = md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gm, "<h3>$1</h3>")
        .replace(/^## (.*$)/gm, "<h2>$1</h2>")
        .replace(/^# (.*$)/gm, "<h1>$1</h1>")
        .replace(/^---$/gm, "<hr style='border:none;border-top:1px solid #e2e8f0;margin:16px 0'/>")
        .replace(/^&gt; (.*$)/gm, "<blockquote>$1</blockquote>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.*?)\*/g, "<em>$1</em>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");

      // Convert Markdown tables
      html = html.replace(/((?:\|.*\|\r?\n)+)/g, (block) => {
        const rows = block.trim().split(/\r?\n/).filter(r => !/^\|[\s:-]+\|$/.test(r.replace(/[^|\s:-]/g, "")));
        if (rows.length < 2) return block;
        const tableRows = rows.map((r, idx) => {
          const cells = r.split("|").slice(1, -1).map(c => c.trim());
          const tag = idx === 0 ? "th" : "td";
          return `<tr>${cells.map(c => `<${tag}>${c}</${tag}>`).join("")}</tr>`;
        }).join("");
        return `<table>${tableRows}</table>`;
      });

      // Convert bullet lists
      html = html.replace(/((?:^\* .*\r?\n?)+)/gm, (list) => {
        const items = list.trim().split(/\r?\n/).map(i => `<li>${i.replace(/^\* /, "")}</li>`).join("");
        return `<ul>${items}</ul>`;
      });

      return html.replace(/\n{2,}/g, "</p><p>");
    }

    function renderSourcePills(ids) {
      if (!ids || !ids.length) return "";
      const items = ids.map(id => {
        const q = state.sourceMap[id.trim()];
        return q
          ? `<a class="source-link" href="${q.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ ${q.titel}</a>`
          : `<span class="source-link">${id}</span>`;
      }).join("");
      return `<div class="sources">${items}</div>`;
    }

    function renderTimeline() {
      const list = state.filterDiffOnly ? state.events.filter(e => e.differenz_jahre > 0) : state.events;
      return `
        <div class="controls">
          <button class="filter-btn ${state.filterDiffOnly ? "active" : ""}" onclick="toggleFilter()">
            ${state.filterDiffOnly ? "✓ Nur Abweichungen" : "Alle Ereignisse anzeigen"}
          </button>
          <div class="legend">
            <span><i class="dot" style="background:#f59e0b"></i>jw.org</span>
