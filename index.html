<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronologie-Vergleich: Zerstörung Jerusalems</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; line-height: 1.5; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; }
    .tab { background: #fff; border: 1px solid #cbd5e1; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tab.active { background: #1e293b; color: #fff; border-color: #1e293b; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    .jw { background: #fffbeb; border: 1px solid #fde68a; padding: 10px; border-radius: 8px; }
    .hist { background: #f0f9ff; border: 1px solid #bae6fd; padding: 10px; border-radius: 8px; }
    .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; }
    .pill { display: inline-block; font-size: 11px; background: #f1f5f9; color: #0f172a; padding: 3px 8px; border-radius: 5px; text-decoration: none; border: 1px solid #cbd5e1; margin: 4px 4px 0 0; }
    .err { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }

    /* Horizontaler Zeitstrahl */
    .tl-box { overflow-x: auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .tl { position: relative; min-width: 740px; height: 190px; }
    .line-jw { position: absolute; left: 20px; right: 20px; top: 52px; height: 2px; background: #f59e0b; }
    .line-hist { position: absolute; left: 20px; right: 20px; top: 132px; height: 2px; background: #0284c7; }
    .tick { position: absolute; top: 10px; bottom: 20px; border-left: 1px dashed #e2e8f0; font-size: 10px; color: #94a3b8; padding-left: 3px; }
    .pt { position: absolute; transform: translate(-50%, -50%); cursor: pointer; text-align: center; font-size: 11px; font-weight: 700; }
    .pt i { display: block; width: 14px; height: 14px; border-radius: 50%; margin: 2px auto; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .pt.sel i { width: 18px; height: 18px; outline: 2px solid #1e293b; }
    .pt-jw { top: 52px; color: #92400e; }
    .pt-jw i { background: #d97706; }
    .pt-hist { top: 132px; color: #075985; }
    .pt-hist i { background: #0284c7; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid #e2e8f0; padding: 6px 8px; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Zerstörung Jerusalems: 607 vs. 587 v. u. Z.</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-t="tl">Zeitstrahl</button>
      <button class="tab" data-t="arg">Streitpunkte</button>
      <button class="tab" data-t="doc">Analysen & Rohdaten</button>
      <button class="tab" data-t="src">Quellen</button>
    </div>
    <div id="err"></div>
    <div id="view">Lade Daten aus Repository...</div>
  </div>

  <script>
    const S = { tab: "tl", events: [], args: [], sources: {}, srcList: [], sel: "evt-03", doc: "analysen/03-direktvergleich.md", docs: {} };
    const DOC_LIST = [
      ["analysen/03-direktvergleich.md", "Direktvergleich"],
      ["analysen/01-sichtweise-jw.md", "01: jw.org"],
      ["analysen/02-sichtweise-hist.md", "02: Historisch"],
      ["rohdaten/zitate-sammlung.md", "Rohdaten"]
    ];

    const yr = y => Math.abs(y) + " v. u. Z.";
    const pills = ids => (ids || []).filter(Boolean).map(id => {
      const q = S.sources[id.trim()];
      return q ? `<a class="pill" href="${q.url}" target="_blank">↗ ${q.titel}</a>` : `<span class="pill">${id}</span>`;
    }).join("");

    function parseCSV(txt) {
      const lines = txt.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const split = l => {
        const out = []; let cur = "", q = false;
        for (const c of l) {
          if (c === '"') q = !q;
          else if (c === ',' && !q) { out.push(cur); cur = ""; }
          else cur += c;
        }
        out.push(cur);
        return out;
      };
      const head = split(lines.shift());
      return lines.map(l => {
        const vals = split(l), o = {};
        head.forEach((h, i) => o[h.trim()] = (vals.at(i) || "").trim());
        return o;
      });
    }

    function mdToHtml(md) {
      return md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/^### (.*$)/gm, "<h3>$1</h3>")
        .replace(/^## (.*$)/gm, "<h2>$1</h2>")
        .replace(/^# (.*$)/gm, "<h1>$1</h1>")
        .replace(/^&gt; (.*$)/gm, "<blockquote style='border-left:3px solid #94a3b8;padding-left:10px;color:#475569'>$1</blockquote>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/((?:\|.*\|\r?\n)+)/g, b => {
          const rows = b.trim().split(/\r?\n/).filter(r => !/^\|[\s:-]+\|$/.test(r.replace(/[^|\s:-]/g, "")));
          return "<table>" + rows.map((r, i) => "<tr>" + r.split("|").slice(1, -1).map(c => `<${i ? "td" : "th"}>${c.trim()}</${i ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>";
        })
        .replace(/\n{2,}/g, "<br><br>");
    }

    function render() {
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.t === S.tab));
      const v = document.getElementById("view");

      if (S.tab === "tl") {
        if (!S.events.length) { v.innerHTML = "<div class='card'>Keine Daten in <code>data/zeitstrahl.json</code>.</div>"; return; }
        const pct = y => 5 + ((y - (-630)) / 98) * 90;
        const ticks = [-630, -620, -610, -600, -590, -580, -570, -560, -550, -540]
          .map(d => `<div class="tick" style="left:${pct(d)}%">${Math.abs(d)}</div>`).join("");
        const lines = S.events.map(e => `<line x1="${pct(e.jahr_jw)}%" y1="52" x2="${pct(e.jahr_hist)}%" y2="132" stroke="${e.id === S.sel ? '#1e293b' : '#cbd5e1'}" stroke-dasharray="3,3" stroke-width="${e.id === S.sel ? 2 : 1}"/>`).join("");
        const pts = S.events.map(e => `
          <div class="pt pt-jw ${e.id === S.sel ? 'sel' : ''}" style="left:${pct(e.jahr_jw)}%" onclick="pick('${e.id}')">${Math.abs(e.jahr_jw)}<i></i></div>
          <div class="pt pt-hist ${e.id === S.sel ? 'sel' : ''}" style="left:${pct(e.jahr_hist)}%" onclick="pick('${e.id}')"><i></i>${Math.abs(e.jahr_hist)}</div>
        `).join("");
        const cur = S.events.find(e => e.id === S.sel) || S.events.at(0);

        v.innerHTML = `
          <div class="tl-box"><div class="tl">
            ${ticks}<div class="line-jw"></div><div class="line-hist"></div>
            <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">${lines}</svg>
            ${pts}
          </div></div>
          <div class="card">
            <strong>${cur.ereignis}</strong>
            <div class="grid">
              <div class="jw"><div class="tag">jw.org</div><strong>${yr(cur.jahr_jw)}</strong></div>
              <div class="hist"><div class="tag">Historisch</div><strong>${yr(cur.jahr_hist)}</strong></div>
            </div>
            <p style="font-size:14px;margin:10px 0 6px">${cur.beschreibung}</p>
            ${pills(cur.quellen_ids)}
          </div>`;
      }

      if (S.tab === "arg") {
        v.innerHTML = S.args.map(a => `
          <div class="card">
            <strong>${a.streitpunkt}</strong>
            <div class="grid">
              <div class="jw"><div class="tag">jw.org (607)</div><div style="font-weight:700;margin:3px 0">${a.position_jw}</div><div style="font-size:13px">${a.begruendung_jw}</div>${pills((a.quellen_jw || "").split(";"))}</div>
              <div class="hist"><div class="tag">Historisch (587)</div><div style="font-weight:700;margin:3px 0">${a.position_hist}</div><div style="font-size:13px">${a.begruendung_hist}</div>${pills((a.quellen_hist || "").split(";"))}</div>
            </div>
          </div>`).join("") || "<div class='card'>Keine Daten in <code>data/argumente.csv</code>.</div>";
      }

      if (S.tab === "doc") {
        const btns = DOC_LIST.map(([p, l]) => `<button class="tab ${S.doc === p ? 'active' : ''}" onclick="openDoc('${p}')">${l}</button>`).join("");
        v.innerHTML = `<div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">${btns}</div><div class="card">${S.docs[S.doc] || "Lade..."}</div>`;
      }

      if (S.tab === "src") {
        v.innerHTML = S.srcList.map(s => `
          <div class="card">
            <div class="tag">${s.kategorie} • ${s.id}</div>
            <strong>${s.titel}</strong>
            <p style="font-size:13px;margin:6px 0">${s.kernaussage}</p>
            <a class="pill" href="${s.url}" target="_blank">↗ Quelle öffnen</a>
          </div>`).join("");
      }
    }

    window.pick = id => { S.sel = id; render(); };
    window.openDoc = async p => {
      S.doc = p; render();
      if (!S.docs[p]) {
        const r = await fetch("./" + p + "?v=" + Date.now());
        S.docs[p] = r.ok ? mdToHtml(await r.text()) : "Datei nicht gefunden: " + p;
        render();
      }
    };

    document.getElementById("tabs").addEventListener("click", e => {
      const b = e.target.closest(".tab");
      if (!b) return;
      S.tab = b.dataset.t;
      if (S.tab === "doc" && !S.docs[S.doc]) openDoc(S.doc);
      else render();
    });

    (async () => {
      const errs = [];
const load = async (path, fn) => {
try {
const r = await fetch("./" + path + "?v=" + Date.now());
if (!r.ok) throw new Error("HTTP " + r.status);
fn(await r.text());
} catch (e) { errs.push(path + ": " + e.message); }
};
await load("data/zeitstrahl.json", t => S.events = JSON.parse(t));
await load("data/quellen.json", t => { S.srcList = JSON.parse(t); S.srcList.forEach(s => S.sources[s.id] = s); });
await load("data/argumente.csv", t => S.args = parseCSV(t));
if (errs.length) document.getElementById("err").innerHTML = <div class="err">Fehler beim Laden: ${errs.join(" | ")}</div>;
render();
})();
