<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronologie-Vergleich: Zerstörung Jerusalems</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --accent: #4f46e5; --jw: #d97706; --jw-bg: #fffbeb; --hist: #0284c7; --hist-bg: #f0f9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .container { max-width: 960px; margin: 0 auto; padding: 18px 14px 48px; }
    header { margin-bottom: 16px; }
    .eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    h1 { margin: 4px 0 6px; font-size: 22px; line-height: 1.25; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
    .tab-btn { background: var(--card); border: 1px solid var(--border); padding: 8px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Horizontal Proportional Timeline */
    .timeline-wrapper { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .tl-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
    .tl-legend { display: flex; gap: 14px; font-weight: 600; }
    .dot-ind { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
    .tl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
    .tl-canvas { position: relative; min-width: 780px; height: 230px; background: linear-gradient(to bottom, #fffdf7 0%, #fffdf7 46%, #f8fafc 46%, #f8fafc 54%, #f7fbff 54%, #f7fbff 100%); border: 1px solid var(--border); border-radius: 10px; }

    /* Decade Gridlines */
    .grid-line { position: absolute; top: 0; bottom: 24px; border-left: 1px dashed #cbd5e1; pointer-events: none; }
    .grid-label { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 10px; font-weight: 600; color: #64748b; white-space: nowrap; }

    /* Track Labels */
    .track-tag { position: absolute; left: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; z-index: 2; pointer-events: none; }
    .tag-jw { top: 8px; background: #fef3c7; color: #92400e; }
    .tag-hist { bottom: 30px; background: #e0f2fe; color: #075985; }

    /* Track Axis Lines */
    .axis-jw { position: absolute; left: 24px; right: 24px; top: 64px; height: 2px; background: #fcd34d; }
    .axis-hist { position: absolute; left: 24px; right: 24px; top: 152px; height: 2px; background: #7dd3fc; }

    /* Event Nodes */
    .node { position: absolute; transform: translate(-50%, -50%); cursor: pointer; z-index: 3; text-align: center; transition: transform 0.12s; }
    .node:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 5; }
    .node-circle { width: 15px; height: 15px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25); margin: 0 auto; }
    .node-jw { top: 65px; }
    .node-jw .node-circle { background: var(--jw); }
    .node-hist { top: 153px; }
    .node-hist .node-circle { background: var(--hist); }
    .node.selected .node-circle { width: 20px; height: 20px; ring: 3px solid var(--accent); box-shadow: 0 0 0 3px var(--accent); }
    .node-year { font-size: 10px; font-weight: 800; white-space: nowrap; background: rgba(255,255,255,0.92); padding: 1px 4px; border-radius: 4px; }
    .node-jw .node-year { color: #92400e; margin-bottom: 3px; }
    .node-hist .node-year { color: #075985; margin-top: 3px; }

    /* Connector SVG */
    .connector-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    /* Cards & Grids */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .card-title { font-size: 16px; font-weight: 700; margin: 0; }
    .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .badge-diff { background: #ffe4e6; color: #be123c; }
    .badge-same { background: #d1fae5; color: #047857; }
    .badge-cat { background: #f1f5f9; color: #334155; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .grid-stack { grid-template-columns: 1fr; } }
    .box-jw { background: var(--jw-bg); border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; }
    .box-hist { background: var(--hist-bg); border: 1px solid #bae6fd; border-radius: 8px; padding: 10px 12px; }
    .box-label { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .box-jw .box-label { color: #92400e; }
    .box-hist .box-label { color: #075985; }
    .box-year { font-size: 18px; font-weight: 800; margin-top: 2px; }
    .box-claim { font-size: 14px; font-weight: 700; margin: 4px 0; }
    .box-desc { font-size: 13px; color: #334155; margin: 0; }

    .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .source-link { font-size: 11px; font-weight: 600; background: #f1f5f9; color: #1e293b; text-decoration: none; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border); display: inline-block; }
    .filter-btn { background: var(--card); border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); }
    .filter-btn.active { background: #e0e7ff; color: #3730a3; border-color: #a5b4fc; }
    .doc-switcher { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .md-view { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; font-size: 14px; }
    .md-view h1 { font-size: 19px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .md-view h2 { font-size: 16px; margin-top: 20px; }
    .md-view h3 { font-size: 14px; margin-top: 14px; }
    .md-view blockquote { margin: 10px 0; padding: 8px 12px; background: #f8fafc; border-left: 3px solid var(--accent); font-style: italic; }
    .md-view table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 12px; display: block; overflow-x: auto; }
    .md-view th, .md-view td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; }
    .md-view th { background: #f1f5f9; }
    .notice { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="eyebrow">Recherche-Projekt • Interaktiver Vergleich</div>
      <h1>Zerstörung Jerusalems: 607 vs. 587 v. u. Z.</h1>
      <p class="subtitle">Maßstabsgetreuer Zeitstrahl und Quellenabgleich zwischen jw.org und Geschichtswissenschaft.</p>
    </header>

    <nav class="tabs" id="tabNav">
      <button type="button" class="tab-btn active" data-tab="timeline">1. Zeitstrahl (Horizontal)</button>
      <button type="button" class="tab-btn" data-tab="arguments">2. Streitpunkte</button>
      <button type="button" class="tab-btn" data-tab="analyses">3. Analysen & Rohdaten</button>
      <button type="button" class="tab-btn" data-tab="sources">4. Quellen-Index</button>
    </nav>

    <div id="notice"></div>
    <main id="app"></main>
  </div>
