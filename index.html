<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronologie-Vergleich: Zerstörung Jerusalems</title>
  <style>
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --border: #e2e8f0; --accent: #4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .container { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
    .eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    h1 { margin: 4px 0 8px; font-size: 26px; }
    .subtitle { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    button { background: var(--card); border: 1px solid #cbd5e1; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text); }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 14px; cursor: pointer; transition: border-color 0.15s; }
    .card.selected { border: 2px solid var(--accent); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .card-title { font-size: 17px; font-weight: 700; margin: 0; }
    .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
    .badge-diff { background: #ffe4e6; color: #be123c; }
    .badge-same { background: #d1fae5; color: #047857; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .box-jw { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; }
    .box-hist { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 8px; padding: 10px 12px; }
    .box-label { font-size: 12px; font-weight: 600; }
    .box-jw .box-label { color: #92400e; }
    .box-hist .box-label { color: #075985; }
    .box-year { font-size: 20px; font-weight: 800; margin-top: 2px; }
    .details { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 14px; color: #334155; }
    .sources { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .source-link { font-size: 12px; background: #f1f5f9; color: #1e293b; text-decoration: none; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); }
    .notice { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="eyebrow">Interaktiver Daten-Vergleich</div>
      <h1>Datierung der Zerstörung Jerusalems</h1>
      <p class="subtitle">Gegenüberstellung der Chronologie von Jehovas Zeugen (jw.org) und der akademischen Geschichtswissenschaft.</p>
      <div class="controls">
        <button id="filterBtn">Alle Ereignisse anzeigen</button>
        <div class="legend">
          <span><i class="dot" style="background:#f59e0b"></i>jw.org</span>
          <span><i class="dot" style="background:#0284c7"></i>Historisch</span>
        </div>
      </div>
    </header>
    <div id="notice"></div>
    <div id="timeline">Lade Daten...</div>
  </div>

  <script>
    const FALLBACK = [{
      id: "evt-03",
      ereignis: "Zerstörung Jerusalems und des Tempels (Fallback)",
      jahr_jw: -607,
      jahr_hist: -587,
      differenz_jahre: 20,
      beschreibung: "data/zeitstrahl.json konnte nicht geladen werden – dies ist der eingebaute Test-Datensatz.",
      quellen_ids: []
    }];

    let events = [];
    let sources = {};
    let selectedId = "evt-03";
    let filterDiffOnly = false;

    const formatYear = (y) => `${Math.abs(y)} v. u. Z.`;

    function render() {
      const container = document.getElementById("timeline");
      const btn = document.getElementById("filterBtn");
      btn.textContent = filterDiffOnly ? "✓ Nur Abweichungen" : "Alle Ereignisse anzeigen";
      btn.className = filterDiffOnly ? "active" : "";

      const list = filterDiffOnly ? events.filter(e => e.differenz_jahre > 0) : events;
      container.innerHTML = list.map(evt => {
        const isSel = evt.id === selectedId;
        const badge = evt.differenz_jahre > 0
          ? `<span class="badge badge-diff">Δ ${evt.differenz_jahre} ${evt.differenz_jahre === 1 ? "Jahr" : "Jahre"} Differenz</span>`
          : `<span class="badge badge-same">Übereinstimmung</span>`;

        const links = (evt.quellen_ids || []).map(id => {
          const q = sources[id];
          return q
            ? `<a class="source-link" href="${q.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ ${q.titel}</a>`
            : `<span class="source-link">${id}</span>`;
        }).join("");

        return `
          <div class="card ${isSel ? "selected" : ""}" onclick="selectCard('${evt.id}')">
            <div class="card-header">
              <h2 class="card-title">${evt.ereignis}</h2>
              ${badge}
            </div>
            <div class="grid">
              <div class="box-jw">
                <div class="box-label">jw.org Chronologie</div>
                <div class="box-year">${formatYear(evt.jahr_jw)}</div>
              </div>
              <div class="box-hist">
                <div class="box-label">Geschichtswissenschaft</div>
                <div class="box-year">${formatYear(evt.jahr_hist)}</div>
              </div>
            </div>
            ${isSel ? `<div class="details"><p style="margin:0">${evt.beschreibung}</p>${links ? `<div class="sources">${links}</div>` : ""}</div>` : ""}
          </div>
        `;
      }).join("");
    }

    window.selectCard = function(id) {
      selectedId = id;
      render();
    };

    document.getElementById("filterBtn").addEventListener("click", () => {
      filterDiffOnly = !filterDiffOnly;
      render();
    });

    Promise.all([
      fetch("./data/zeitstrahl.json?v=" + Date.now()).then(r => {
        if (!r.ok) throw new Error("data/zeitstrahl.json nicht gefunden (HTTP " + r.status + ")");
        return r.json();
      }),
      fetch("./data/quellen.json?v=" + Date.now()).then(r => r.ok ? r.json() : []).catch(() => [])
    ]).then(([tData, sData]) => {
      events = tData;
      sData.forEach(s => sources[s.id] = s);
      render();
    }).catch(err => {
      document.getElementById("notice").innerHTML = `<div class="notice">Hinweis: ${err.message}</div>`;
      events = FALLBACK;
      render();
    });
  </script>
</body>
</html>
